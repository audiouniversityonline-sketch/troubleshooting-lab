<style>
  :root {
    --bg: #0e0e10;
    --panel: #1b1b1e;
    --panel-2: #232327;
    --panel-3: #2c2c31;
    --line: #38383e;
    --line-2: #4a4a52;
    --ink: #e9e6df;
    --ink-2: #a5a29a;
    --ink-3: #6c6a64;
    --accent: #ffc93a;
    --hot: #ff4630;
    --green: #4ade80;
    --amber: #ffb547;
    --cool: #6aa9ff;
    --aux: #b88dff;
    --label: #d9d5cb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: 'Geist', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; height: 100%; }
  #root { width: 100vw; height: 100vh; }
  button { font-family: inherit; color: inherit; }
  .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
  .display { font-family: 'Bricolage Grotesque', 'Geist', sans-serif; letter-spacing: -0.02em; }

  .ui-no-select { user-select: none; -webkit-user-select: none; }
  .knob, .fader-track, .fader-cap { cursor: ns-resize; }
  .toggle, .button-pad { cursor: pointer; }

  @keyframes pulse {
    0% { opacity: 0.5; transform: scale(0.95); }
    100% { opacity: 0; transform: scale(1.4); }
  }
  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0.25; }
  }
  /* Cable plug handles — hover grows them and brightens the glow so the
     user can feel that they're grabbable. The transform-box trick keeps
     SVG scale anchored at the circle's own center, not the SVG origin. */
  .cable-handle {
    transition: r 0.12s ease, filter 0.12s ease;
    transform-origin: center; transform-box: fill-box;
    filter: drop-shadow(0 0 3px rgba(255,255,255,0.3));
  }
  .cable-hit:hover + .cable-handle,
  .cable-handle:hover {
    filter: drop-shadow(0 0 7px rgba(255,255,255,0.75));
  }
  .cable-hit { cursor: grab; }
  .cable-hit:active { cursor: grabbing; }

  /* Phantom-power pop flash overlay — sharp peak then fast fade, mirroring
     the actual DC transient. */
  @keyframes phantomPopFlash {
    0%   { opacity: 0; }
    8%   { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes phantomPopText {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    14%  { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
    35%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
  }
</style>

<script type="text/babel">
const SOURCES = {
  vocal:  { label: 'Vocal Mic 1', short: 'VOCAL 1', kind: 'dynamic',   icon: 'mic', color: '#ff4630' },
  // Bass DI is ACTIVE (buffered electronics, needs +48V phantom like a
  // condenser). Keyboard DI is PASSIVE (transformer, no power). The diActive
  // flag drives the phantom gate and the source-card label. (Real rule of
  // thumb is the opposite pairing, but either box works on either source;
  // this assignment is Kyle's choice for the lesson.)
  guitar: { label: 'Bass DI',     short: 'BASS',    kind: 'di', diActive: true, icon: 'di', color: '#ffc93a' },
  laptop: { label: 'Keyboard DI', short: 'KEYS',    kind: 'di',        icon: 'di',  color: '#4ade80' },
  vocal2: { label: 'Vocal Mic 2', short: 'VOCAL 2', kind: 'condenser', icon: 'mic', color: '#ff8e4a' },
  // Front-of-house stereo playback (a media player at the desk, not on stage).
  // A line input on a dedicated 5/6 channel used to test the system with music.
  playback: { label: 'Playback 5/6', short: 'PLAYBACK', kind: 'playback', icon: 'media', color: '#6aa9ff' },
};

// Per-source amplitude envelope. Real instruments and voices have dynamics:
// syllable-rate amplitude modulation, slower phrase-level intensity changes,
// and occasional transient peaks well above the steady level. The envelope
// here is a deterministic function of time that combines three layers:
//   - phrase: slow sinusoid (~0.3-0.7 Hz) representing emphasis breathing
//   - syllable: faster sinusoid (1.2-5 Hz) representing syllable / note rate
//   - bursts: sparse pulses ~once per 3-10 seconds representing transients
// The result rides between roughly 0.85 and 1.20 around baseline. Meters
// bounce realistically and a student learning gain staging has to leave room
// for the occasional peak instead of pinning the steady level to the top.
const ENV_PROFILES = {
  vocal:  { syllableRate: 5.0, syllableDepth: 0.06, phraseRate: 0.7, phraseDepth: 0.03, burstRate: 0.30, burstDur: 0.05, burstAmp: 0.15, syllablePhase: 0.0, burstSeed: 0.10 },
  vocal2: { syllableRate: 4.5, syllableDepth: 0.05, phraseRate: 0.6, phraseDepth: 0.03, burstRate: 0.25, burstDur: 0.04, burstAmp: 0.13, syllablePhase: 1.7, burstSeed: 0.60 },
  guitar: { syllableRate: 2.5, syllableDepth: 0.04, phraseRate: 0.4, phraseDepth: 0.02, burstRate: 0.15, burstDur: 0.05, burstAmp: 0.08, syllablePhase: 2.3, burstSeed: 0.40 },
  laptop: { syllableRate: 1.2, syllableDepth: 0.03, phraseRate: 0.3, phraseDepth: 0.02, burstRate: 0.10, burstDur: 0.10, burstAmp: 0.05, syllablePhase: 3.1, burstSeed: 0.90 },
};

function envelopeFactor(srcKey, tSec) {
  const p = ENV_PROFILES[srcKey] || ENV_PROFILES.vocal;
  const phrase = 1 + p.phraseDepth * Math.sin(2 * Math.PI * p.phraseRate * tSec);
  const syll = 1 + p.syllableDepth * Math.sin(2 * Math.PI * p.syllableRate * tSec + p.syllablePhase);
  const burstPhase = ((tSec * p.burstRate + p.burstSeed) % 1 + 1) % 1;
  const burst = burstPhase < p.burstDur ? (1 + p.burstAmp * (1 - burstPhase / p.burstDur)) : 1;
  return phrase * syll * burst;
}

// Map combined PA output (linear amplitude, 0..~3+ when multiple channels
// sum) to dB SPL at the audience. Calibration is a logarithmic curve so
// doublings of output amplitude read as roughly +6 dB on the meter — close
// to physical reality — and the readout saturates near real-world concert
// SPLs (110-115 dB) instead of running off to nonsense values when channels
// stack. Reference points the curve hits, by design:
//   paAvg 0.0   → 60 dB SPL  (quiet room ambient)
//   paAvg ~0.34 → ~86 dB SPL (typical default concert mix in this trainer)
//   paAvg ~1.0  → ~97 dB SPL (loud concert, NIOSH 30-min limit)
//   paAvg ~3.0  → ~109 dB SPL (very loud, damage risk)
function dbSplFromPa(paAvg) {
  if (!Number.isFinite(paAvg) || paAvg <= 0) return 60;
  return 60 + 25 * Math.log10(1 + 30 * paAvg);
}

// NIOSH (National Institute for Occupational Safety and Health) maximum daily
// noise exposure, 3 dB exchange rate. Reference: NIOSH Recommended Exposure
// Limit (REL) is 85 dB(A) for 8 hours; every 3 dB doubles damage, halving the
// permissible exposure time. https://www.cdc.gov/niosh/topics/noise/
// Returns a short string suitable for the SPL meter readout. Numbers and the
// 3 dB exchange rate are taken directly from the NIOSH REL, not approximated.
function nioshExposure(db) {
  if (db < 70) return { text: 'comfortable listening', zone: 'safe' };
  if (db < 85) return { text: 'safe all day', zone: 'safe' };
  // hours = 8 * 2^(-(db-85)/3)
  const hours = 8 * Math.pow(2, -(db - 85) / 3);
  if (hours >= 1) return { text: 'NIOSH limit: ' + Math.round(hours) + ' h/day', zone: hours >= 4 ? 'watch' : 'limit' };
  const minutes = hours * 60;
  if (minutes >= 1) return { text: 'NIOSH limit: ' + Math.round(minutes) + ' min/day', zone: minutes >= 15 ? 'limit' : 'damage' };
  const seconds = Math.max(1, Math.round(minutes * 60));
  return { text: 'NIOSH limit: ' + seconds + ' sec/day', zone: 'damage' };
}

const DESTINATIONS = {
  pa:     { label: 'Main PA',         short: 'PA',      stereo: true,  description: 'House speakers. What the audience hears.' },
  wedge:  { label: 'Wedge 1',         short: 'WEDGE 1', stereo: false, description: 'Floor wedge for Vocal Mic 1.' },
  wedge2: { label: 'Wedge 2',         short: 'WEDGE 2', stereo: false, description: 'Floor wedge for Vocal Mic 2.' },
};

// Graphic EQ on the monitor sends — the band frequencies, low to high. A cut on
// the band a wedge rings at (its ringBand) drops the feedback loop at that
// frequency. Bands 0-1 are "low" (an HPF can help there); 2-4 are mid/high
// (only the EQ rings those out). EQ_CUT_DB = the cut at a band's full setting.
const EQ_BANDS = ['125', '400', '1k', '2.5k', '6.3k'];
const EQ_CUT_DB = 12;
// Linear relief multiplier from a band's cut fraction (0 flat .. 1 full cut).
function eqBandRelief(cutFrac) {
  const c = Math.max(0, Math.min(1, cutFrac || 0));
  return Math.pow(10, (-EQ_CUT_DB * c) / 20);
}

const DEFAULT_CHANNEL = {
  label: '—',
  gain: 0.0,
  phantom: false,
  highpass: false,
  lowCut: false,
  pan: 0.5,
  aux1: 0.0,
  aux2: 0.0,
  mute: false,
  solo: false,
  fader: 0.0,
  // inputTrim represents how loud the source's signal arrives at the channel
  // before the preamp acts on it (a quiet talker, a low-output DI, a mic
  // placed too far from the source). Default 1.0 = nominal. Levels that need
  // to teach "the source itself is the problem" can author this lower.
  inputTrim: 1.0,
};

function makeChannel(o = {}) { return { ...DEFAULT_CHANNEL, ...o }; }

function defaultState() {
  return {
    channels: [
      makeChannel({ id: 1, label: 'Vocal 1', gain: 0.55, phantom: false, fader: 0.72, pan: 0.5, aux1: 0.0 }),
      makeChannel({ id: 2, label: 'Vocal 2', gain: 0.55, phantom: true,  fader: 0.72, pan: 0.5, aux1: 0.0 }),
      makeChannel({ id: 3, label: 'Bass',    gain: 0.50,                 fader: 0.65, pan: 0.5, aux1: 0.0 }),
      makeChannel({ id: 4, label: 'Keys',    gain: 0.45,                 fader: 0.60, pan: 0.5, aux1: 0.0 }),
      makeChannel({ id: 5, label: '5/6',     gain: 0.55, stereo: true,   fader: 0.70, pan: 0.5, aux1: 0.0 }),
    ],
    // Mixer / console power state. Default ON for all existing levels.
    // The Power-On Sequence lesson sabotages this to false and teaches the
    // safe boot order: console on → master down → amp on → master up.
    // When mixer.on is false, computeAudio zeros out every output so no
    // signal reaches the PA, wedges, or even the channel post-fader meters.
    mixer: { on: true },
    // Master fader default sits below unity — compensates for the
    // pan law's louder summing at center so a typical mix doesn't peg
    // the master meter into red just by opening the desk.
    master: { fader: 0.55, mute: false, aux1: 0.75, aux2: 0.75 },
    outputs: {
      pa_l:   { on: true, mute: false, volume: 0.7 },
      pa_r:   { on: true, mute: false, volume: 0.7 },
      // eq: per-band cut on the monitor send, 0 (flat) .. 1 (full -12 dB cut),
      // one entry per EQ_BANDS frequency. ringBand: the band this wedge rings
      // at when it feeds back (its resonant frequency). Cutting that band on
      // the monitor EQ rings the wedge out.
      wedge:  { on: true, mute: false, volume: 0.0, eq: [0, 0, 0, 0, 0], ringBand: 3 },
      wedge2: { on: true, mute: false, volume: 0.0, eq: [0, 0, 0, 0, 0], ringBand: 2 },
      amp:    { on: true },
    },
    cables: {
      vocal: 1, vocal2: 2, guitar: 3, laptop: 4,
      out_pa_l: true, out_pa_r: true, out_wedge: true, out_wedge2: true,
    },
    fanOut: [1, 2, 3, 4],
    sourceMute: { vocal: false, guitar: false, laptop: false, vocal2: false, playback: false },
    testing: 'vocal',
    inspect: 'pa',
    topology: {
      mixerLocation: 'side-stage',
      paRig: 'powered',
      wedgeLocation: 'stage',
    },
    // phantomPop: set when the user engages +48V phantom while the channel,
    // master, and a speaker are all live — a DC pop is sent to the rig.
    // Cleared on reset / level change. Blocks the level from registering as
    // solved (the lesson is: do it the safe way, not just any way that
    // ends with phantom on).
    phantomPop: null,
  };
}

const DEFAULT_TOPOLOGY = {
  mixerLocation: 'side-stage',
  paRig: 'powered',
  wedgeLocation: 'stage',
};

function effectiveChannel(s, srcKey) {
  // Playback is a FOH line input hardwired to the 5/6 channel — it plugs into
  // the desk, not the stage snake, so it skips the cable/fan-out path.
  if (srcKey === 'playback') {
    return s.channels && s.channels.length >= 5 ? 5 : 0;
  }
  const port = s.cables[srcKey];
  if (!port || port < 1) return 0;
  const fan = s.fanOut || [1, 2, 3, 4];
  const ch = fan[port - 1];
  return ch >= 1 && ch <= s.channels.length ? ch : 0;
}

function sourceFor(s, chIdxZero) {
  for (const k of Object.keys(SOURCES)) {
    if (effectiveChannel(s, k) === chIdxZero + 1) return k;
  }
  return null;
}

function panGains(pan) {
  // Live-sound pan law: panning ATTENUATES the opposite side only. At
  // center (pan = 0.5), both L and R sit at unity — no -3 dB cut. Panning
  // hard left leaves L untouched and drops R to zero. This matches the
  // pan-pot behaviour on most modern digital consoles and DAWs, where the
  // engineer is expected to ride the master fader down to compensate for
  // multiple channels summing hot at center.
  return {
    L: pan <= 0.5 ? 1.0 : 1.0 - (pan - 0.5) * 2,
    R: pan >= 0.5 ? 1.0 : pan * 2,
  };
}

function computeAudio(s, envelope) {
  // PFL = Pre-Fader Listen. The Solo button on a live console is a PFL
  // (or AFL) monitor button — it routes the channel to the engineer's
  // headphone bus only. It does NOT alter the master mix or aux sends.
  // The audience hears the same mix whether or not the engineer is
  // listening to a single channel in their cans. (The destructive
  // "Solo-In-Place" mode that mutes the rest of the mix is a recording-
  // console feature, not a live-sound one.) anyPfl drives the audio
  // engine's monitor override below — when any channel is in PFL the
  // engineer's headphones play just those channels' pre-fader signal,
  // but the master/aux outputs continue normally.
  const anyPfl = s.channels.some(c => c.solo);

  // BASELINE chanIn — the steady-state level the gain SETTING produces,
  // independent of any per-frame envelope. Used by clip block detection,
  // coaching, and anything else that should be stable instead of bouncing
  // with the signal. inputTrim scales the source's amplitude before the
  // preamp acts on it (a quiet talker, a low-output DI). Default 1.0.
  const baselineChanIn = s.channels.map((ch, i) => {
    const srcKey = sourceFor(s, i);
    if (!srcKey) return { level: 0, srcKey: null };
    if (s.sourceMute[srcKey]) return { level: 0, srcKey };
    const srcDef = SOURCES[srcKey];
    // Condensers and ACTIVE DIs need +48V phantom to pass signal. Dynamics and
    // passive DIs work without it. No phantom on a powered input = dead channel.
    if ((srcDef.kind === 'condenser' || srcDef.diActive) && !ch.phantom) return { level: 0, srcKey };
    const trim = ch.inputTrim != null ? ch.inputTrim : 1;
    return { level: (0.35 + ch.gain * 1.1) * trim, srcKey };
  });

  // INSTANT chanIn — what the meter shows right now, with per-source
  // envelope dynamics applied. Falls back to baseline when no envelope is
  // supplied (during initial render before the animation loop starts).
  const chanIn = baselineChanIn.map(c => {
    if (!c.srcKey || !envelope) return c;
    const f = envelope[c.srcKey];
    if (f == null) return c;
    return { level: c.level * f, srcKey: c.srcKey };
  });

  const post = s.channels.map((ch, i) => {
    if (ch.mute) return 0;
    return chanIn[i].level * ch.fader;
  });

  let mixL = 0, mixR = 0;
  for (let i = 0; i < s.channels.length; i++) {
    const g = panGains(s.channels[i].pan);
    mixL += post[i] * g.L;
    mixR += post[i] * g.R;
  }
  // MAIN MIX BUS — the signal that leaves the desk, post-master-fader but
  // BEFORE any downstream PA gear. This is what the console's L/R master
  // meter should show. It is independent of PA speaker on/off, mute, or
  // volume: that's downstream of the desk. Likewise the per-channel
  // post-fader meters (audio.post) are independent of master and PA — that's
  // why the channel still meters when the master is down.
  // Mixer power gate. When the console is off, no signal leaves the desk,
  // no matter how the channels and master are set. The post-fader meters
  // and channel meters still show what WOULD be on the wire so the
  // engineer can verify their setup before flipping the power on.
  const mixerOn = s.mixer ? s.mixer.on !== false : true;
  const masterGate = (s.master.mute || !mixerOn) ? 0 : s.master.fader;
  const mainBusL = mixL * masterGate;
  const mainBusR = mixR * masterGate;

  const o = s.outputs;
  const topo = s.topology || DEFAULT_TOPOLOGY;
  const passivePA = topo.paRig === 'amp+passive';
  const ampOn = !passivePA || (o.amp && o.amp.on);
  const paGate = ampOn ? 1 : 0;
  // In passive mode the speakers have no power switch of their own — the
  // external amp powers them. So ignore the speaker's `on` flag and let the
  // amp gate decide. In powered (active) mode each speaker is its own power.
  const paLOn = passivePA ? true : o.pa_l.on;
  const paROn = passivePA ? true : o.pa_r.on;
  // PA SPEAKER OUTPUT — main bus × speaker on/mute/volume × amp gate. This is
  // what each speaker is actually producing; the on-speaker LED meter reads
  // from this. Turning the PA down should NOT silence the master meter on
  // the desk, only this value.
  // The 1.3 multiplier sits below the previous 1.7 so a typical
  // multi-channel mix at default settings doesn't park the speaker LED in
  // the red — there's visible headroom before red, and cranking really hot
  // (user pushes channel gain or speaker volume up) still drives clipping.
  const paL = paLOn && !o.pa_l.mute && s.cables.out_pa_l ? mainBusL * o.pa_l.volume * 1.3 * paGate : 0;
  const paR = paROn && !o.pa_r.mute && s.cables.out_pa_r ? mainBusR * o.pa_r.volume * 1.3 * paGate : 0;

  // Aux master gains — each aux send bus has a master level knob on the console
  // before it leaves the desk (in addition to per-channel aux send + destination volume).
  const aux1MasterGain = s.master.aux1 != null ? s.master.aux1 : 1;
  const aux2MasterGain = s.master.aux2 != null ? s.master.aux2 : 1;

  const aux1 = s.channels.map((ch, i) => {
    if (ch.mute) return 0;
    // PFL does NOT gate aux sends — the band's monitor mix keeps playing
    // regardless of what the engineer is listening to in their cans.
    return chanIn[i].level * ch.aux1;
  });
  // AUX 1 / AUX 2 SEND BUSES — sum of all channels' aux send levels through
  // the per-bus master send. These represent what's leaving the desk on each
  // aux output, independent of the downstream wedge speaker. Wedge LED meters
  // get the post-speaker value (wedge / wedge2 below); any desk-side aux
  // meter would read wedgeMix / wedge2Mix.
  // Aux send buses also stop leaving the desk when the mixer is off.
  const wedgeMix = aux1.reduce((a, b) => a + b, 0) * aux1MasterGain * (mixerOn ? 1 : 0);
  const wedge = o.wedge.on && !o.wedge.mute && s.cables.out_wedge ? wedgeMix * o.wedge.volume * 1.6 : 0;

  const aux2 = s.channels.map((ch, i) => {
    if (ch.mute) return 0;
    // PFL does NOT gate aux 2 either.
    return chanIn[i].level * ch.aux2;
  });
  const wedge2Mix = aux2.reduce((a, b) => a + b, 0) * aux2MasterGain * (mixerOn ? 1 : 0);
  const w2 = o.wedge2 || { on: true, mute: false, volume: 0 };
  const wedge2 = w2.on && !w2.mute && s.cables.out_wedge2 ? wedge2Mix * w2.volume * 1.6 : 0;

  const contributions = {};
  for (const srcKey of Object.keys(SOURCES)) {
    let cL = 0, cR = 0, cW1 = 0, cW2 = 0;
    for (let i = 0; i < s.channels.length; i++) {
      if (chanIn[i].srcKey !== srcKey) continue;
      const ch = s.channels[i];
      const g = panGains(ch.pan);
      cL += post[i] * g.L;
      cR += post[i] * g.R;
      cW1 += aux1[i];
      cW2 += aux2[i];
    }
    cL *= masterGate * paGate * (paLOn && !o.pa_l.mute && s.cables.out_pa_l ? o.pa_l.volume * 1.3 : 0);
    cR *= masterGate * paGate * (paROn && !o.pa_r.mute && s.cables.out_pa_r ? o.pa_r.volume * 1.3 : 0);
    cW1 *= aux1MasterGain * (o.wedge.on && !o.wedge.mute && s.cables.out_wedge ? o.wedge.volume * 1.6 : 0);
    cW2 *= aux2MasterGain * (w2.on && !w2.mute && s.cables.out_wedge2 ? w2.volume * 1.6 : 0);
    contributions[srcKey] = { pa_l: cL, pa_r: cR, wedge: cW1, wedge2: cW2 };
  }

  // PFL bus — the engineer's headphone bus. Sum of pre-fader signals of
  // every PFL-engaged channel, weighted by source. Keyed by source key so
  // the audio engine can play the same per-source synth chains it uses for
  // destination monitoring. Pre-fader, so the fader position of a soloed
  // channel doesn't change what's in the engineer's cans.
  const pflBus = {};
  let pflTotal = 0;
  for (let i = 0; i < s.channels.length; i++) {
    if (!s.channels[i].solo) continue;
    const k = chanIn[i].srcKey;
    if (!k) continue;
    pflBus[k] = (pflBus[k] || 0) + chanIn[i].level;
    pflTotal += chanIn[i].level;
  }

  return {
    chanIn: chanIn.map(c => c.level),
    chanInBaseline: baselineChanIn.map(c => c.level),
    chanInSource: chanIn.map(c => c.srcKey),
    post,
    aux1,
    aux2,
    // mainBus / auxBus = what the desk is sending downstream, post all desk
    // gain stages but BEFORE the speaker's own volume/on/mute. Console-side
    // meters read from these so the desk reflects what it's putting out
    // regardless of what's happening at the speaker.
    mainBus: { L: mainBusL, R: mainBusR },
    // wedgeMix / wedge2Mix already include their respective aux master gains.
    auxBus:  { wedge: wedgeMix, wedge2: wedge2Mix },
    // outputs = what each downstream speaker is actually producing (with the
    // speaker's volume, on/mute, and amp gate folded in). The on-speaker LED
    // meters read from these.
    outputs: { pa_l: paL, pa_r: paR, wedge, wedge2 },
    // speakerInput = what's ARRIVING at each speaker, BEFORE the speaker's own
    // volume / on / mute. This is what a real powered speaker's "signal" LED
    // shows: signal is reaching the box regardless of where the speaker's
    // volume knob is set. The volume knob is the engineer's room-loudness
    // knob; the LED is "the console is sending me signal."
    speakerInput: {
      pa_l: mainBusL * paGate * (s.cables.out_pa_l ? 1 : 0),
      pa_r: mainBusR * paGate * (s.cables.out_pa_r ? 1 : 0),
      wedge:  wedgeMix  * (s.cables.out_wedge  ? 1 : 0),
      wedge2: wedge2Mix * (s.cables.out_wedge2 ? 1 : 0),
    },
    paGate,
    contributions,
    anyPfl,
    pflBus,
    pflLevel: pflTotal,
    // Legacy alias — code that read `anySolo` should switch to `anyPfl`.
    anySolo: anyPfl,
  };
}

function traceTo(s, srcKey, dest) {
  const stages = [];
  let blocked = false;
  const add = (name, ok, detail, blocking = true) => {
    if (blocked) { stages.push({ name, ok: true, detail: '—', reachable: false }); return; }
    stages.push({ name, ok, detail, reachable: true });
    if (!ok && blocking) blocked = true;
  };

  const srcDef = SOURCES[srcKey];
  if (!srcDef) return { stages: [], faultStage: -1, level: 0 };

  const srcMuted = s.sourceMute[srcKey];
  add('Source', !srcMuted, srcMuted ? `${srcDef.label} muted` : `${srcDef.label} live`);

  const stagePort = s.cables[srcKey];
  const stageValid = stagePort >= 1 && stagePort <= s.channels.length;
  add('Stage Box', stageValid, stageValid ? `port ${stagePort}` : 'cable unplugged');

  const ch = stageValid ? (s.fanOut ? s.fanOut[stagePort - 1] : stagePort) : 0;
  const valid = ch >= 1 && ch <= s.channels.length;
  add('Fan-Out', valid, valid ? `→ Ch ${ch}` : 'no channel patched');
  const channel = valid ? s.channels[ch - 1] : null;

  if (srcDef.kind === 'condenser' || srcDef.diActive) {
    add('+48V', channel ? channel.phantom : false, channel?.phantom ? 'phantom on' : 'needs +48V');
  } else {
    add('+48V', true, srcDef.kind === 'di' ? 'n/a · passive DI' : srcDef.kind === 'dynamic' ? 'n/a · dynamic' : 'n/a · line', false);
  }

  add('Gain', channel ? channel.gain > 0.05 : false, channel ? (channel.gain <= 0.05 ? 'preamp at 0' : `${Math.round(channel.gain * 60)} dB`) : '—');
  add('Mute', channel ? !channel.mute : false, channel ? (channel.mute ? 'channel muted' : 'unmuted') : '—');

  // PFL (Solo) is a monitor-only function — it routes the channel to the
  // engineer's headphones without affecting the master mix. So we no
  // longer add a "Solo" stage to the signal-flow trace. The PFL state is
  // a cans-side concern, not a mix-side fault.

  if (dest === 'wedge') {
    add('Aux 1', channel ? channel.aux1 > 0.05 : false, channel ? (channel.aux1 <= 0.05 ? 'aux 1 at 0' : `${Math.round(channel.aux1 * 100)}%`) : '—');
    add('Wedge Out', s.cables.out_wedge && s.outputs.wedge.on && !s.outputs.wedge.mute,
      !s.cables.out_wedge ? 'wedge cable unplugged' : !s.outputs.wedge.on ? 'wedge off' : s.outputs.wedge.mute ? 'wedge muted' : 'powered');
    add('Wedge Vol', s.outputs.wedge.volume > 0.05, s.outputs.wedge.volume <= 0.05 ? 'volume down' : `${Math.round(s.outputs.wedge.volume * 100)}%`);
  } else if (dest === 'wedge2') {
    add('Aux 2', channel ? channel.aux2 > 0.05 : false, channel ? (channel.aux2 <= 0.05 ? 'aux 2 at 0' : `${Math.round(channel.aux2 * 100)}%`) : '—');
    const w2 = s.outputs.wedge2 || { on: true, mute: false, volume: 0 };
    add('Wedge Out', s.cables.out_wedge2 && w2.on && !w2.mute,
      !s.cables.out_wedge2 ? 'wedge cable unplugged' : !w2.on ? 'wedge off' : w2.mute ? 'wedge muted' : 'powered');
    add('Wedge Vol', w2.volume > 0.05, w2.volume <= 0.05 ? 'volume down' : `${Math.round(w2.volume * 100)}%`);
  } else if (dest === 'pa') {
    add('Fader', channel ? channel.fader > 0.05 : false, channel ? (channel.fader <= 0.001 ? 'at -∞' : faderDb(channel.fader)) : '—');
    if (channel) {
      const p = channel.pan;
      const panLbl = p < 0.45 ? `L${Math.round((0.5 - p) * 200)}` : p > 0.55 ? `R${Math.round((p - 0.5) * 200)}` : 'C';
      add('Pan', true, panLbl, false);
    } else add('Pan', false, '—');
    add('Master', !s.master.mute, s.master.mute ? 'master muted' : 'open');
    add('Mix', s.master.fader > 0.05, s.master.fader <= 0.001 ? 'at -∞' : faderDb(s.master.fader));
    const topo = s.topology || DEFAULT_TOPOLOGY;
    if (topo.paRig === 'amp+passive') {
      add('Amp', s.outputs.amp && s.outputs.amp.on, s.outputs.amp && s.outputs.amp.on ? 'powered' : 'amp off');
    }
    const paLOk = s.cables.out_pa_l && s.outputs.pa_l.on && !s.outputs.pa_l.mute;
    const paROk = s.cables.out_pa_r && s.outputs.pa_r.on && !s.outputs.pa_r.mute;
    add('PA Out', paLOk || paROk, paLOk && paROk ? 'L + R live' : paLOk ? 'L only' : paROk ? 'R only' : 'PA silent');
    add('PA Vol', (paLOk && s.outputs.pa_l.volume > 0.05) || (paROk && s.outputs.pa_r.volume > 0.05),
      `L ${Math.round(s.outputs.pa_l.volume * 100)}% · R ${Math.round(s.outputs.pa_r.volume * 100)}%`);
  }

  const audio = computeAudio(s);
  const c = audio.contributions[srcKey] || {};
  let level = 0;
  if (dest === 'pa') level = Math.max(c.pa_l, c.pa_r);
  else if (dest === 'wedge') level = c.wedge;
  else if (dest === 'wedge2') level = c.wedge2;

  return { stages, faultStage: stages.findIndex(s => !s.ok && s.reachable), level };
}

function faderDb(v) {
  if (v <= 0.001) return '-∞';
  const db = 20 * Math.log10(v / 0.75);
  return db >= 0 ? `+${db.toFixed(1)} dB` : `${db.toFixed(1)} dB`;
}

function checkWin(s, conditions) {
  const audio = computeAudio(s);
  for (const c of conditions) {
    const cont = audio.contributions[c.source];
    if (!cont) return false;
    let lvl;
    if (c.dest === 'pa') lvl = Math.max(cont.pa_l, cont.pa_r);
    else lvl = cont[c.dest] || 0;
    if (c.min != null && lvl < c.min) return false;
    if (c.max != null && lvl > c.max) return false;
    if (c.min == null && c.max == null && lvl < 0.3) return false;
  }
  return true;
}

// LEVELS and CHALLENGE_BANK now live in content.js (loaded as a plain
// <script> before this block, setting window.LEVELS / window.CHALLENGE_BANK).
// Split out so new scenarios drip in by editing one small data file, not this
// app shell. Append-only: never renumber existing ids (progress is saved by id).

// Clip detection across the signal chain. "In the red" on any meter means
// the engineer is over-driving that stage — distortion in real life, which
// is unacceptable for a working mix. Returns a list of active clip events;
// empty list means everything's clean. Different stages call for different
// fixes, and the message we surface to the user is stage-specific so they
// learn which knob to reach for.
//
// Thresholds are tuned to roughly match "red lights showing on the rendered
// meter" — the underlying value × the display gain multiplier crosses ~0.95.
//
// Returned shape (per active clip):
//   { stage: 'channel' | 'master' | 'speaker',
//     id: number | string,         // channel idx (0-based) or 'L'/'R' or 'pa_l' etc.
//     label: string,               // human label for the chip
//     fix: string }                // short instruction telling the user what to do
function detectClipping(audio, state) {
  // Walk the chain UPSTREAM → DOWNSTREAM and stop at the first stage that's
  // hot. Each stage has its OWN gain control; clipping at one stage can't
  // be fixed by reducing a downstream control. If the preamp is overdriven,
  // pulling the fader down just attenuates a signal that's already
  // distorted — the harmonic content was generated upstream. So we surface
  // the upstream-most clipping stage and tell the user which knob actually
  // fixes it.
  //
  // Thresholds match the moment the corresponding meter first shows its
  // top red LED — what "in the red" means to the user. For each meter
  // lit = round(displayValue / 1.1 * segments), red is the top 2 segments.
  //
  //   Preamp (PFL bar, 14 segs, ×0.95 display)  → chanIn > 1.03
  //   Channel meter (22 segs, ×1.2 display)     → post > 0.93
  //   Master (26 segs, ×0.85 display)           → mainBus > 1.22
  //   Speaker (10 segs, ×1.0 display)           → outputs > 1.03

  // Stage 1 — PREAMP (channel input after the gain knob). The PFL bar's
  // red zone. Only the GAIN knob fixes this; the fader is downstream and
  // can't undo distortion that's already been baked in.
  //
  // Reads the BASELINE chanIn (no envelope) so the block fires on gain
  // SETTING, not on transient peaks. With the synthesized envelope adding
  // up to ~+20% on transients, threshold sits at 1.05 so default-gain
  // baselines (~0.955) don't false-trigger while a deliberately hot preamp
  // (above gain 0.64-ish) still gets caught.
  if (audio && audio.chanInBaseline) {
    const preampClips = [];
    audio.chanInBaseline.forEach((v, i) => {
      if (v > 1.05) {
        preampClips.push({
          stage: 'preamp',
          id: i,
          label: `Channel ${i + 1} preamp`,
          fix: 'Turn the GAIN down. The fader can\'t fix an overdriven preamp, because the distortion happens before the fader.',
        });
      }
    });
    if (preampClips.length) return preampClips;
  }

  // Stage 2 — CHANNEL METER (post-fader). Preamp is clean but the fader is
  // pushing the channel into the red, or the combination of gain + fader
  // is hot enough that the meter reads red even though the preamp itself
  // is below its red zone.
  if (audio && audio.post) {
    const channelClips = [];
    audio.post.forEach((p, i) => {
      if (p > 0.93) {
        channelClips.push({
          stage: 'channel',
          id: i,
          label: `Channel ${i + 1}`,
          fix: 'Turn the channel FADER down. The channel meter is in the red.',
        });
      }
    });
    if (channelClips.length) return channelClips;
  }

  // Stage 3 — MAIN BUS. Channels and faders are clean but the SUMMED
  // signal at the master is too hot. Fix is master fader or coordinated
  // channel backoff.
  if (audio && audio.mainBus) {
    const L = audio.mainBus.L || 0;
    const R = audio.mainBus.R || 0;
    if (L > 1.22 || R > 1.22) {
      return [{
        stage: 'master',
        id: L > R ? 'L' : 'R',
        label: 'Master Bus',
        fix: 'Turn the MASTER fader down, or turn down some channel faders. Too many loud channels add up.',
      }];
    }
  }

  // Stage 4 — SPEAKERS. The desk is clean but a speaker is being
  // overdriven by its own volume knob.
  if (audio && audio.outputs) {
    const speakers = [
      { key: 'pa_l',   label: 'PA L',     fix: 'Turn the PA L volume down.' },
      { key: 'pa_r',   label: 'PA R',     fix: 'Turn the PA R volume down.' },
      { key: 'wedge',  label: 'Wedge 1',  fix: 'Turn the Wedge 1 volume down.' },
      { key: 'wedge2', label: 'Wedge 2',  fix: 'Turn the Wedge 2 volume down.' },
    ];
    const speakerClips = [];
    for (const s of speakers) {
      const lvl = audio.outputs[s.key] || 0;
      if (lvl > 1.03) speakerClips.push({ stage: 'speaker', id: s.key, label: s.label, fix: s.fix });
    }
    if (speakerClips.length) return speakerClips;
  }

  return [];
}

// Phantom power safety check. In real life, slamming +48V on while the
// channel is open and the PA is hot creates a sharp DC transient that pops
// the speakers — bad for tweeters, ribbon mics, and ears. Standard practice
// is to mute the channel (or pull the fader down) BEFORE engaging phantom,
// wait a beat for the capsule to charge, then bring the channel back up.
// This helper looks at the state at the moment the phantom button is hit
// and returns true if engaging phantom right now would pop the rig.
function wouldPopPhantom(s, channelIdx) {
  const ch = s.channels[channelIdx];
  if (!ch) return false;
  const channelOpen = !ch.mute && ch.fader > 0.05;
  const masterOpen  = !s.master.mute && s.master.fader > 0.05;
  const o = s.outputs || {};
  const paLLive = o.pa_l && o.pa_l.on && !o.pa_l.mute && o.pa_l.volume > 0.05 && s.cables.out_pa_l;
  const paRLive = o.pa_r && o.pa_r.on && !o.pa_r.mute && o.pa_r.volume > 0.05 && s.cables.out_pa_r;
  // Wedge can also pop if the channel's aux send is up — same DC transient
  // hits the aux bus.
  const auxOpen = ch.aux1 > 0.05 || ch.aux2 > 0.05;
  const wedgeLive  = auxOpen && o.wedge  && o.wedge.on  && !o.wedge.mute  && o.wedge.volume  > 0.05 && s.cables.out_wedge;
  const wedge2Live = auxOpen && o.wedge2 && o.wedge2.on && !o.wedge2.mute && o.wedge2.volume > 0.05 && s.cables.out_wedge2;
  const speakerLive = paLLive || paRLive || wedgeLive || wedge2Live;
  return channelOpen && (masterOpen ? speakerLive : (wedgeLive || wedge2Live));
}

// Amp turn-on safety check. Real-world passive rig: console is on, master
// is up, channels are passing signal. The amp is off. Flip the amp on like
// that and a full-level mix slams into the speakers the instant they come
// alive. It's not a DC pop. It's an abrupt loud-signal event: the audience
// gets blasted, and on a hot day the speakers get an unhealthy momentary
// hit. The fix is the power-on sequence: drop the master, flip the amp,
// bring the master back up gently so the level you take to the room is the
// level you chose, not whatever the channels happened to be at.
function wouldBlastOnAmpOn(s) {
  if (!s || !s.master) return false;
  // Mixer off means no signal leaves the desk, so the amp just powers up
  // into silence. Safe.
  if (s.mixer && s.mixer.on === false) return false;
  // Master pulled or muted? Safe to flip the amp.
  if (s.master.mute) return false;
  if (s.master.fader <= 0.1) return false;
  // Master open but no channel is passing signal? Nothing to blast with.
  const anyHotChannel = s.channels && s.channels.some(c => !c.mute && c.fader > 0.05 && c.gain > 0.05);
  if (!anyHotChannel) return false;
  return true;
}

// Mixer turn-on safety check — the ELECTRICAL pop. This is a different failure
// from the amp-on blast. Powering the console on while an amp it feeds (the
// main power amp, or a powered wedge) is already live sends the desk's switch-
// on transient straight into that live amp, and it pops the speakers. It
// happens regardless of the master, muted or not, because it's a DC/switch
// transient, not program level. The fix is the order: always power the console
// on FIRST, before any amp, so there's nothing live to pop into.
function wouldPopOnMixerOn(s) {
  if (!s || !s.outputs) return false;
  const o = s.outputs;
  const c = s.cables || {};
  const topo = s.topology || {};
  // Is a power amp / powered output stage the desk feeds already live?
  const mainLive = topo.paRig === 'amp+passive'
    ? !!(o.amp && o.amp.on && (c.out_pa_l || c.out_pa_r))
    : !!((o.pa_l && o.pa_l.on && c.out_pa_l) || (o.pa_r && o.pa_r.on && c.out_pa_r));
  const wedgeLive = !!((o.wedge && o.wedge.on && c.out_wedge) || (o.wedge2 && o.wedge2.on && c.out_wedge2));
  return mainLive || wedgeLive;
}

window.SOURCES = SOURCES;
window.DESTINATIONS = DESTINATIONS;
window.defaultState = defaultState;
window.computeAudio = computeAudio;
window.traceTo = traceTo;
window.checkWin = checkWin;
window.sourceFor = sourceFor;
window.faderDb = faderDb;
// Plug-pop safety check. Plugging an XLR into a hot input — the rig is on,
// the channel is unmuted, the master is up, a speaker is live — sends a
// connector-contact transient straight to the PA. Same speaker-killing
// pop as the phantom one, same UX (POPPED, reset required). The check
// here mirrors wouldPopPhantom's logic but reasons about the channel
// that the NEWLY PATCHED port will land on, not a static channelIdx.
function wouldPopOnPlug(s, srcKey, newPort) {
  if (!newPort || newPort < 1) return false; // 0 = unplug, no plug-in pop
  const fanOut = s.fanOut || [1, 2, 3, 4];
  const ch1Based = fanOut[newPort - 1];
  if (!ch1Based) return false;
  return wouldPopPhantom(s, ch1Based - 1);
}

// PA stereo balance. In a real venue the L and R speakers should match —
// same level, same on/mute state — so the audience hears a coherent
// stereo image. If the master is open and the two PAs aren't symmetric,
// flag it. Returns null when balanced or when the PA is silent overall.
function detectPaBalanceIssue(s) {
  if (!s || !s.outputs) return null;
  const masterOpen = !s.master.mute && s.master.fader > 0.05;
  if (!masterOpen) return null;
  const pl = s.outputs.pa_l;
  const pr = s.outputs.pa_r;
  if (!pl || !pr) return null;
  const lActive = pl.on && !pl.mute;
  const rActive = pr.on && !pr.mute;
  // Both PAs silenced — engineer deliberately killed the rig. Not a balance fault.
  if (!lActive && !rActive) return null;
  if (lActive !== rActive) {
    return {
      stage: 'pa_balance',
      label: 'PA Balance',
      fix: lActive
        ? 'PA R is off. Turn it on and match PA L\'s level so the audience hears a balanced stereo mix.'
        : 'PA L is off. Turn it on and match PA R\'s level so the audience hears a balanced stereo mix.',
    };
  }
  const diff = Math.abs(pl.volume - pr.volume);
  if (diff > 0.05) {
    return {
      stage: 'pa_balance',
      label: 'PA Balance',
      fix: `PA L: ${Math.round(pl.volume * 100)}%, PA R: ${Math.round(pr.volume * 100)}%. Match them so the room hears a balanced stereo mix.`,
    };
  }
  return null;
}

// Gain-staging coaching — meter-driven (not knob-driven) so the logic
// stays correct when realistic samples replace the synthesized test signal.
// Each pattern asks: "is any stage's meter outside its healthy band?" and
// surfaces a plain-English explanation of why fixing it at the WRONG stage
// is a problem. Returns an array of coaching messages, possibly empty.
function detectGainStagingMistakes(state, audio, level) {
  if (!audio || !state || !level) return [];
  const mistakes = [];
  const baseline = audio.chanInBaseline || audio.chanIn || [];
  const involved = (window.deriveInvolves ? window.deriveInvolves(level) : []) || [];
  // Healthy chanIn band (linear amplitude, baseline / steady-state).
  // Tuned to the existing app's chanIn calibration so default gain settings
  // (chanIn ≈ 0.955) sit comfortably inside the healthy band and intentional
  // overshoots fire coaching. Above clip-block threshold (~1.05), the clip
  // detector takes over — coaching here only covers the "hot but not yet
  // clipping" window where a transient peak would clip.
  const COLD = 0.55;
  const HOT  = 1.00;

  // Per-involved-channel checks
  for (const chNum of involved) {
    const idx = chNum - 1;
    if (idx < 0 || idx >= baseline.length) continue;
    const ch = state.channels[idx];
    if (!ch || ch.mute) continue;
    const lvl = baseline[idx] || 0;
    // Skip channels not producing meaningful signal at the preamp (no source
    // patched, condenser without phantom, etc.). Coaching only applies once
    // there is signal at the channel input.
    if (lvl < 0.05) continue;

    if (lvl < COLD && ch.gain < 0.85) {
      mistakes.push({
        kind: 'cold_channel',
        message: 'Channel ' + chNum + '\'s meter is barely registering, but the audience can still hear the channel. Something later in the chain got turned up to compensate, and that boosts noise and hiss along with the signal. Turn GAIN up until the channel\'s own meter sits in the healthy zone, then bring the other controls back to normal.',
      });
    } else if (lvl < COLD + 0.10 && ch.gain >= 0.85) {
      mistakes.push({
        kind: 'source_limited',
        message: 'GAIN on Channel ' + chNum + ' is near max but the channel meter is still sitting low. The source itself is the limit. Real fix is at the source: get the performer closer to the mic, switch to a more sensitive mic, or check placement. Until then, use the fader to balance the channel against the band.',
      });
    } else if (lvl > HOT) {
      mistakes.push({
        kind: 'hot_channel',
        message: 'Channel ' + chNum + '\'s meter is sitting near the top. It looks safe right now, but a singer leaning in or a drum hit can easily be 10 dB louder than what you\'re seeing, and that peak will distort. Turn GAIN down until the meter sits in the healthy zone with room to spare.',
      });
    }
  }

  // Master fader too hot. The master sits near unity (0.75 in this sim);
  // above ~0.90 is the engineer using it as makeup gain.
  if (state.master && state.master.fader > 0.90) {
    mistakes.push({
      kind: 'hot_master',
      message: 'The master fader is pushed near the top. It normally sits at its unity mark. If the mix is too quiet with the master at a normal position, adjust the amp or speaker level instead. Those get set once for each room.',
    });
  }

  // Speaker volume too hot. Speakers are tuned for the room once and left
  // alone. Mid-show speaker pushes raise loop gain across every mic and
  // shift the tonal balance the rig was tuned for.
  const paLv = (state.outputs && state.outputs.pa_l && state.outputs.pa_l.volume) || 0;
  const paRv = (state.outputs && state.outputs.pa_r && state.outputs.pa_r.volume) || 0;
  if (paLv > 0.90 || paRv > 0.90) {
    mistakes.push({
      kind: 'hot_speakers',
      message: 'The PA speaker volume is turned up too high. Speaker level gets set once when the system is tuned for the room, then left alone. Changing it mid-show changes how everything sounds and raises the chance of feedback. If one channel is too quiet, fix that channel. If the whole room needs to be louder, use the master fader.',
    });
  }

  // Audience hearing-safety. Numbers and exposure framing come from the
  // NIOSH Recommended Exposure Limit (REL): 85 dB / 8 hours, 3 dB exchange
  // rate. Coaching only fires above 100 dB (15-min limit) to avoid alarming
  // about routine concert levels.
  const paOut = (((audio.outputs && audio.outputs.pa_l) || 0) + ((audio.outputs && audio.outputs.pa_r) || 0)) / 2;
  const db = window.dbSplFromPa ? window.dbSplFromPa(paOut) : (50 + 50 * paOut);
  if (db >= 100) {
    const exp = window.nioshExposure ? window.nioshExposure(db) : { text: 'above NIOSH safe limits' };
    mistakes.push({
      kind: 'hearing_safety',
      message: 'The audience is hearing ' + Math.round(db) + ' dB SPL at front-of-house right now (' + exp.text + '). Sustained levels at or above 100 dB SPL cause permanent hearing damage with extended exposure, per the NIOSH Recommended Exposure Limit. Pull the speakers down before you do any more of the show at this level.',
    });
  }

  return mistakes;
}

window.wouldPopPhantom = wouldPopPhantom;
window.wouldBlastOnAmpOn = wouldBlastOnAmpOn;
window.wouldPopOnMixerOn = wouldPopOnMixerOn;

// Feedback loop detector. Live-sound feedback is a closed loop: a mic picks up
// a speaker it can hear, the desk sends that signal back out the speaker, the
// speaker re-amplifies what the mic heard, round and round until the loop hits
// unity gain and rings. So the thing that drives feedback is how LOUD the mic
// is coming back out of a speaker it can hear — the mic's actual output level
// at that speaker. That already folds in every gain stage: preamp gain, the
// fader/aux send that routes it, the master/aux master, AND the speaker's own
// volume knob. We read those real per-mic output levels straight off the audio
// engine (audio.contributions[src]) so any control that pushes the output past
// the ring threshold trips it, including the speaker volume itself.
//
// Two acoustic paths, different coupling:
//   - WEDGE: points straight back at the mic, so full coupling. This is the
//     usual culprit and rings at a moderate level.
//   - MAINS: face the audience, away from the mic, so weak coupling. They only
//     ring when driven really hard (gain + fader + master + PA volume all hot).
// HPF rolls off the low-frequency stage rumble that builds the loop fastest, so
// engaging it drops the effective loop gain ~40% — often enough on its own to
// drop a ringing wedge back under threshold. Engine field name is `highpass`.
//
// Returns null when safe, or { channelIdx, riskAmount } when a loop is hot.
function detectFeedback(s, audio) {
  if (!s || !s.channels || !audio || !audio.contributions) return null;
  const WEDGE_COUPLING = 1.0;   // wedge points at the mic
  const MAINS_COUPLING = 0.22;  // mains face away — only ring when cranked hard
  const RING_THRESHOLD = 0.55;
  const o = s.outputs || {};
  // Loop gain through one wedge for a mic, after that wedge's EQ cut at its
  // ring band and (for a low ring band only) an HPF on the channel. The EQ is
  // the surgical fix; HPF only helps low-frequency ringing.
  const wedgeRisk = (w, contrib, hpf) => {
    if (!w || !contrib) return 0;
    const band = w.ringBand != null ? w.ringBand : 2;
    const eqRelief = w.eq ? eqBandRelief(w.eq[band]) : 1.0;
    const hpfRelief = (hpf && band <= 1) ? 0.6 : 1.0;
    return contrib * WEDGE_COUPLING * eqRelief * hpfRelief;
  };
  for (let i = 0; i < s.channels.length; i++) {
    const ch = s.channels[i];
    if (ch.mute) continue;
    const srcKey = sourceFor(s, i);
    if (!srcKey) continue;
    const srcDef = SOURCES[srcKey];
    // Only live mics are acoustically coupled to the stage. DIs and line
    // inputs (bass DI, keyboard DI) can't feed back. Condensers need phantom.
    if (!srcDef || (srcDef.kind !== 'dynamic' && srcDef.kind !== 'condenser')) continue;
    if (srcDef.kind === 'condenser' && !ch.phantom) continue;
    const c = audio.contributions[srcKey];
    if (!c) continue;
    const w1 = wedgeRisk(o.wedge, c.wedge || 0, ch.highpass);
    const w2 = wedgeRisk(o.wedge2, c.wedge2 || 0, ch.highpass);
    const mainsLoop = ((c.pa_l || 0) + (c.pa_r || 0)) * MAINS_COUPLING * (ch.highpass ? 0.6 : 1.0);
    const risk = Math.max(w1, w2, mainsLoop);
    if (risk > RING_THRESHOLD) {
      // Which wedge is ringing, so the UI can highlight its ring band.
      const ringWedge = w1 >= w2 && w1 >= mainsLoop ? 'wedge' : (w2 >= mainsLoop ? 'wedge2' : null);
      return { channelIdx: i, riskAmount: risk, ringWedge, ringBand: ringWedge ? (o[ringWedge].ringBand) : null };
    }
  }
  return null;
}
window.detectFeedback = detectFeedback;
window.wouldPopOnPlug = wouldPopOnPlug;
window.detectClipping = detectClipping;
window.detectPaBalanceIssue = detectPaBalanceIssue;
window.detectGainStagingMistakes = detectGainStagingMistakes;
window.dbSplFromPa = dbSplFromPa;
window.nioshExposure = nioshExposure;
</script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// Live board scale factor, shared across <script> blocks via window (each
// babel block has its own module scope). App provides it from useFitScale;
// Knob consumes it so pointer-drag sensitivity matches the on-screen (scaled)
// knob size instead of feeling off when the whole board is zoomed to fit.
const FitScaleContext = React.createContext(1);
window.FitScaleContext = FitScaleContext;

function Knob({ value, onChange, min = 0, max = 1, size = 44, label, sublabel, color = 'var(--accent)', track = 'var(--line)', detentAt = null, format = null, disabled = false }) {
  const ref = useRef(null);
  const startRef = useRef(null);
  const fitScale = React.useContext(FitScaleContext);
  const norm = (value - min) / (max - min);
  const angle = -135 + norm * 270;

  const onPointerDown = (e) => {
    if (disabled) return;
    e.preventDefault();
    ref.current.setPointerCapture(e.pointerId);
    startRef.current = { y: e.clientY, v: value };
  };
  const onPointerMove = (e) => {
    if (!startRef.current) return;
    const dy = startRef.current.y - e.clientY;
    // Sensitivity is tuned in layout pixels. When the board is scaled to fit,
    // a client pixel covers 1/fitScale layout pixels, so divide by fitScale to
    // keep the drag feeling 1:1 with the visible (scaled) knob.
    const sens = e.shiftKey ? 600 : 180;
    let v = startRef.current.v + (dy / (sens * fitScale)) * (max - min);
    v = Math.max(min, Math.min(max, v));
    onChange(v);
  };
  const onPointerUp = (e) => {
    if (!startRef.current) return;
    startRef.current = null;
    try { ref.current.releasePointerCapture(e.pointerId); } catch {}
  };
  const onDoubleClick = () => {
    if (disabled) return;
    onChange(detentAt != null ? detentAt : (min + max) / 2);
  };

  const cx = size / 2, cy = size / 2;
  const r = size / 2 - 3;

  const ticks = [];
  for (let i = 0; i <= 10; i++) {
    const a = (-135 + (i / 10) * 270) * Math.PI / 180;
    const x1 = cx + Math.cos(a) * (r + 2);
    const y1 = cy + Math.sin(a) * (r + 2);
    const x2 = cx + Math.cos(a) * (r + 5);
    const y2 = cy + Math.sin(a) * (r + 5);
    ticks.push(<line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke="var(--ink-3)" strokeWidth="1"/>);
  }

  const startA = -135 * Math.PI / 180;
  const endA = angle * Math.PI / 180;
  const arcR = r + 3.5;
  const sx = cx + Math.cos(startA) * arcR;
  const sy = cy + Math.sin(startA) * arcR;
  const ex = cx + Math.cos(endA) * arcR;
  const ey = cy + Math.sin(endA) * arcR;
  const largeArc = endA - startA > Math.PI ? 1 : 0;

  return (
    <div className="ui-no-select" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2, opacity: disabled ? 0.4 : 1 }}>
      {label && <div className="mono" style={{ fontSize: 8.5, letterSpacing: 0.6, color: 'var(--ink-2)', textTransform: 'uppercase' }}>{label}</div>}
      <svg
        ref={ref}
        className="knob"
        width={size + 14} height={size + 14}
        viewBox={`${-7} ${-7} ${size + 14} ${size + 14}`}
        onPointerDown={onPointerDown}
        onPointerMove={onPointerMove}
        onPointerUp={onPointerUp}
        onPointerCancel={onPointerUp}
        onDoubleClick={onDoubleClick}
      >
        {ticks}
        <path d={`M ${sx} ${sy} A ${arcR} ${arcR} 0 ${largeArc} 1 ${ex} ${ey}`} stroke={color} strokeWidth="2" fill="none" strokeLinecap="round" opacity={0.9}/>
        <defs>
          <radialGradient id={`knob-grad-${size}`} cx="35%" cy="30%">
            <stop offset="0%" stopColor="#5a5a62"/>
            <stop offset="55%" stopColor="#2e2e34"/>
            <stop offset="100%" stopColor="#161618"/>
          </radialGradient>
        </defs>
        <circle cx={cx} cy={cy} r={r} fill={`url(#knob-grad-${size})`} stroke="#0a0a0c" strokeWidth="1"/>
        <circle cx={cx} cy={cy} r={r - 2} fill="none" stroke="#3e3e44" strokeWidth="0.7"/>
        <g transform={`rotate(${angle} ${cx} ${cy})`}>
          <line x1={cx} y1={cy + 2} x2={cx} y2={cy - r + 3} stroke="var(--ink)" strokeWidth="2.2" strokeLinecap="round"/>
        </g>
      </svg>
      {sublabel && <div className="mono" style={{ fontSize: 8, color: 'var(--ink-3)', marginTop: -1 }}>{sublabel}</div>}
      {format && <div className="mono" style={{ fontSize: 8, color: 'var(--ink-2)' }}>{format(value)}</div>}
    </div>
  );
}

function Fader({ value, onChange, height = 180, color = '#dcd7c6', tickLabels = true }) {
  const ref = useRef(null);
  const startRef = useRef(null);

  const onPointerDown = (e) => {
    e.preventDefault();
    ref.current.setPointerCapture(e.pointerId);
    const rect = ref.current.getBoundingClientRect();
    const y = e.clientY - rect.top;
    const v = 1 - y / rect.height;
    onChange(Math.max(0, Math.min(1, v)));
    startRef.current = { y: e.clientY, v: Math.max(0, Math.min(1, v)) };
  };
  const onPointerMove = (e) => {
    if (!startRef.current) return;
    const rect = ref.current.getBoundingClientRect();
    const y = e.clientY - rect.top;
    const v = 1 - y / rect.height;
    onChange(Math.max(0, Math.min(1, v)));
  };
  const onPointerUp = (e) => {
    if (!startRef.current) return;
    startRef.current = null;
    try { ref.current.releasePointerCapture(e.pointerId); } catch {}
  };
  const onDoubleClick = () => onChange(0.75);

  const capH = 28;
  const trackH = height;
  const capY = (1 - value) * (trackH - capH);

  const ticks = [
    { v: 1.0, label: '+10' },
    { v: 0.75, label: '0' },
    { v: 0.55, label: '-10' },
    { v: 0.35, label: '-20' },
    { v: 0.18, label: '-40' },
    { v: 0.0, label: '-∞' },
  ];

  return (
    <div className="ui-no-select" style={{ display: 'flex', alignItems: 'center', gap: 4, justifyContent: 'center', position: 'relative' }}>
      {tickLabels && (
        <div style={{ position: 'relative', height: trackH, width: 18, fontSize: 7, color: 'var(--ink-3)' }} className="mono">
          {ticks.map(t => (
            <div key={t.label} style={{ position: 'absolute', right: 0, top: (1 - t.v) * (trackH - capH) + capH / 2 - 4, lineHeight: 1 }}>{t.label}</div>
          ))}
        </div>
      )}
      <div
        ref={ref}
        className="fader-track"
        onPointerDown={onPointerDown}
        onPointerMove={onPointerMove}
        onPointerUp={onPointerUp}
        onPointerCancel={onPointerUp}
        onDoubleClick={onDoubleClick}
        style={{
          position: 'relative',
          width: 22,
          height: trackH,
          background: 'linear-gradient(180deg,#0a0a0c,#141417)',
          border: '1px solid #38383e',
          borderRadius: 3,
          boxShadow: 'inset 0 0 6px rgba(0,0,0,0.6)',
        }}
      >
        <div style={{
          position: 'absolute', left: '50%', top: capH/2, bottom: capH/2,
          width: 2, transform: 'translateX(-50%)',
          background: 'linear-gradient(180deg,#000,#222)', borderRadius: 1,
        }}/>
        <div style={{ position: 'absolute', left: 0, right: 0, top: (1 - 0.75) * (trackH - capH) + capH / 2, height: 1, background: 'var(--accent)', opacity: 0.35 }}/>
        <div className="fader-cap" style={{
          position: 'absolute',
          left: -7, width: 36, height: capH,
          top: capY,
          background: `linear-gradient(180deg, #6b6760 0%, #3a3833 45%, #232220 55%, #4a4742 100%)`,
          border: '1px solid #0a0a0a',
          borderRadius: 3,
          boxShadow: '0 2px 4px rgba(0,0,0,0.6), inset 0 1px 0 #8a857a',
        }}>
          <div style={{ position: 'absolute', left: 0, right: 0, top: '50%', height: 2, background: color, opacity: 0.95, transform: 'translateY(-50%)', boxShadow: `0 0 4px ${color}` }}/>
          <div style={{ position: 'absolute', left: 4, right: 4, top: 4, height: 3, background: '#1a1916', borderRadius: 1 }}/>
          <div style={{ position: 'absolute', left: 4, right: 4, bottom: 4, height: 3, background: '#1a1916', borderRadius: 1 }}/>
        </div>
      </div>
    </div>
  );
}

function LedMeter({ level, height = 180, segments = 18 }) {
  const lit = Math.min(segments, Math.round(level / 1.1 * segments));
  const cells = [];
  for (let i = 0; i < segments; i++) {
    const idx = segments - 1 - i;
    let baseColor;
    if (idx >= segments - 2) baseColor = '#ff4630';
    else if (idx >= segments - 5) baseColor = '#ffb547';
    else baseColor = '#4ade80';
    const on = idx < lit;
    cells.push(
      <div key={i} style={{
        flex: 1, margin: '1px 0', borderRadius: 1,
        background: on ? baseColor : '#1a1a1c',
        boxShadow: on ? `0 0 4px ${baseColor}` : 'inset 0 0 2px #000',
        opacity: on ? 1 : 0.5,
      }}/>
    );
  }
  return (
    <div className="ui-no-select" style={{ display: 'flex', flexDirection: 'column', height, width: 10, padding: 1, background: '#0a0a0c', border: '1px solid #38383e', borderRadius: 2 }}>
      {cells}
    </div>
  );
}

// Small horizontal LED meter — used on destination devices (PA speakers, wedge,
// stream gear) so engineers can see signal arriving at each output without
// needing the full signal-flow diagnostic.
function MiniMeter({ level, width = 44, segments = 10 }) {
  const lit = Math.min(segments, Math.round(level / 1.1 * segments));
  return (
    <div className="ui-no-select" style={{
      display: 'flex', gap: 1,
      width, height: 6,
      padding: 1,
      background: '#0a0a0c',
      border: '1px solid #38383e',
      borderRadius: 2,
    }}>
      {Array.from({ length: segments }).map((_, i) => {
        let c;
        if (i >= segments - 2) c = '#ff4630';
        else if (i >= segments - 4) c = '#ffb547';
        else c = '#4ade80';
        const on = i < lit;
        return <div key={i} style={{
          flex: 1,
          background: on ? c : '#1a1a1c',
          borderRadius: 0.5,
          boxShadow: on ? `0 0 2px ${c}` : 'none',
          opacity: on ? 1 : 0.45,
        }}/>;
      })}
    </div>
  );
}

function ButtonPad({ active, onClick, label, color = 'var(--hot)', width = 28, height = 18, fontSize = 8.5, sub }) {
  return (
    <button
      onClick={onClick}
      className="button-pad ui-no-select mono"
      style={{
        width, height,
        background: active
          ? `linear-gradient(180deg, ${color}, ${shade(color, -25)})`
          : 'linear-gradient(180deg,#2a2a2e,#1c1c1f)',
        color: active ? '#0d0d0e' : 'var(--ink-2)',
        border: '1px solid ' + (active ? shade(color, -40) : '#0a0a0c'),
        borderTop: active ? `1px solid ${shade(color, 25)}` : '1px solid #44444a',
        borderRadius: 2,
        fontSize, fontWeight: 700, letterSpacing: 0.5,
        boxShadow: active ? `0 0 8px ${color}88, inset 0 1px 0 ${shade(color, 30)}` : 'inset 0 1px 0 #444',
        padding: 0,
        cursor: 'pointer',
        textTransform: 'uppercase',
        textAlign: 'center',
        lineHeight: 1,
      }}
    >
      {label}
      {sub && <div style={{ fontSize: 6, fontWeight: 600, opacity: 0.8 }}>{sub}</div>}
    </button>
  );
}

function shade(color, percent) {
  const map = {
    'var(--hot)':    { dark: '#a32a1c', light: '#ff7868' },
    'var(--accent)': { dark: '#a37500', light: '#ffe082' },
    'var(--green)':  { dark: '#1b8b46', light: '#86f0a8' },
    'var(--amber)':  { dark: '#a36d1a', light: '#ffd28a' },
    'var(--cool)':   { dark: '#2c5d9e', light: '#9cc4ff' },
    'var(--aux)':    { dark: '#6c4eb0', light: '#d4bbff' },
  };
  if (map[color]) return percent < 0 ? map[color].dark : map[color].light;
  return color;
}

function Led({ on, color = 'var(--green)', size = 8 }) {
  return (
    <div style={{
      width: size, height: size, borderRadius: '50%',
      background: on ? color : '#222',
      boxShadow: on ? `0 0 6px ${color}` : 'inset 0 0 2px #000',
      border: '1px solid #0a0a0c',
    }}/>
  );
}

window.Knob = Knob;
window.Fader = Fader;
window.LedMeter = LedMeter;
window.MiniMeter = MiniMeter;
window.ButtonPad = ButtonPad;
window.Led = Led;
</script>

<script type="text/babel">
const { Knob: K, Fader: F, LedMeter: M, ButtonPad: BP, Led: L } = window;

function PFLBar({ level, hot }) {
  const segs = 14;
  // Bar full-scale = 1.1 (matches detectClipping's display scale). The
  // healthy operating band sits in the upper amber zone — where peaks of a
  // real dynamic signal should land, leaving headroom above for transients
  // without crossing into the red. Drawn as a thin gold marker above the bar.
  const lit = Math.min(segs, Math.round(level / 1.1 * segs));
  const targetLow = 0.75 / 1.1;
  const targetHigh = 0.95 / 1.1;
  return (
    <div className="ui-no-select" style={{ display: 'flex', flexDirection: 'column', gap: 1, width: '100%' }}>
      <div style={{ position: 'relative', height: 3 }}>
        <div style={{
          position: 'absolute',
          left: (targetLow * 100) + '%',
          width: ((targetHigh - targetLow) * 100) + '%',
          top: 0, height: 3,
          background: 'linear-gradient(180deg, rgba(255,201,58,0.42), rgba(255,181,71,0.55))',
          borderRadius: 1,
        }} title="Healthy peak zone. Aim peaks here, leave headroom above."/>
      </div>
      <div style={{
        display: 'flex', gap: 1,
        width: '100%',
        padding: 2,
        background: '#0a0a0c',
        border: '1px solid ' + (hot ? 'var(--amber)' : '#38383e'),
        borderRadius: 2,
        boxShadow: hot ? '0 0 4px rgba(255,181,71,0.45)' : 'none',
      }}>
        {Array.from({ length: segs }).map((_, i) => {
          let c;
          if (i >= segs - 2) c = '#ff4630';
          else if (i >= segs - 5) c = '#ffb547';
          else c = '#4ade80';
          const on = i < lit;
          return <div key={i} style={{ flex: 1, height: 4, background: on ? c : '#1a1a1c', borderRadius: 0.5, boxShadow: on ? `0 0 3px ${c}` : 'none', opacity: on ? 1 : 0.5 }}/>;
        })}
      </div>
    </div>
  );
}

function ChannelStrip({ ch, idx, onChange, onPhantomToggle, onInspect, channelLevel, pflLevel, isFaultStrip, srcLabel, powered = true }) {
  const insp = (dest) => { if (onInspect) onInspect(dest); };
  const set = (patch) => onChange({ ...ch, ...patch });
  // Phantom power has a parent-owned handler so the App can do its
  // safety/pop check at the moment of engagement. Fall back to the local
  // set() if no handler is wired (keeps the strip standalone-usable).
  const togglePhantom = onPhantomToggle ? () => onPhantomToggle() : () => set({ phantom: !ch.phantom });
  const srcDisplay = srcLabel?.label || (ch.label === '—' ? 'EMPTY' : ch.label);

  return (
    <div style={{
      width: 100,
      background: 'linear-gradient(180deg,#222226 0%, #1a1a1d 8%, #1a1a1d 100%)',
      border: '1px solid #0a0a0c',
      borderTop: '1px solid #3a3a40',
      borderRadius: 4,
      padding: '8px 5px 10px',
      display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 5,
      position: 'relative',
      boxShadow: isFaultStrip ? '0 0 0 1.5px rgba(255,70,48,0.5), 0 0 20px rgba(255,70,48,0.25)' : 'none',
      // Console powered down: the whole strip reads as dead — dimmed and
      // desaturated, the same visual language the speakers/amp use when off.
      opacity: powered ? 1 : 0.5,
      filter: powered ? 'none' : 'grayscale(0.75)',
      transition: 'box-shadow 0.2s, opacity 0.15s, filter 0.15s',
    }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', width: '100%', padding: '0 2px' }}>
        <div className="mono" style={{ fontSize: 8, color: 'var(--ink-3)', fontWeight: 600 }}>CH</div>
        <div className="display" style={{ fontSize: 15, color: 'var(--ink)', fontWeight: 800, lineHeight: 1 }}>{idx + 1}</div>
      </div>

      <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
        <BP active={ch.phantom} onClick={togglePhantom} label="+48V" color="var(--hot)" width={32} height={13} fontSize={7} />
        <L on={powered && ch.phantom} color="var(--hot)" size={5}/>
      </div>

      <K value={ch.gain} onChange={(v) => set({ gain: v })} label="Gain" size={40} color="var(--accent)" />

      <div style={{ width: '94%' }}>
        <PFLBar level={pflLevel} hot={ch.solo}/>
        <div className="mono" style={{ fontSize: 6.5, color: ch.solo ? 'var(--amber)' : 'var(--ink-3)', textAlign: 'center', marginTop: 1, letterSpacing: 0.5, fontWeight: 700 }}>
          {ch.solo ? 'PFL · CANS' : 'INPUT'}
        </div>
      </div>

      <div style={{ display: 'flex', gap: 3, marginTop: 1 }}>
        <BP active={ch.highpass} onClick={() => set({ highpass: !ch.highpass })} label="HPF" color="var(--cool)" width={24} height={12} fontSize={7}/>
        <BP active={ch.lowCut} onClick={() => set({ lowCut: !ch.lowCut })} label="Ø" color="var(--cool)" width={18} height={12} fontSize={8.5}/>
      </div>

      <div style={{ display: 'flex', alignItems: 'flex-start', gap: 6 }}>
        <K value={ch.aux1} onChange={(v) => { set({ aux1: v }); insp('wedge'); }} label="AUX1" size={30} color="var(--aux)" />
        <K value={ch.aux2} onChange={(v) => { set({ aux2: v }); insp('wedge2'); }} label="AUX2" size={30} color="var(--cool)" />
      </div>

      <K value={ch.pan} onChange={(v) => set({ pan: v })} label="PAN" size={32} color="var(--ink)" detentAt={0.5} />

      <div style={{ display: 'flex', gap: 3 }}>
        <BP active={ch.mute} onClick={() => set({ mute: !ch.mute })} label="MUTE" color="var(--hot)" width={28} height={14} fontSize={7}/>
        {/* PFL = Pre-Fader Listen. Monitor-only — routes this channel to
            the engineer's headphone bus. Does NOT mute the rest of the
            mix; the audience keeps hearing everything. */}
        <BP active={ch.solo} onClick={() => set({ solo: !ch.solo })} label="PFL" color="var(--amber)" width={24} height={14} fontSize={7}/>
      </div>

      <div style={{ display: 'flex', alignItems: 'flex-end', gap: 4, marginTop: 1 }}>
        <F value={ch.fader} onChange={(v) => { set({ fader: v }); insp('pa'); }} height={172}/>
        <M level={channelLevel} height={172} segments={22}/>
      </div>

      <div style={{
        marginTop: 2,
        width: 'calc(100% - 4px)',
        background: '#0e0e10',
        color: srcLabel ? 'var(--label)' : 'var(--ink-3)',
        border: '1px solid ' + (srcLabel ? '#38383e' : '#222226'),
        borderRadius: 2,
        padding: '2px 3px',
        fontSize: 8,
        textAlign: 'center',
        letterSpacing: 0.3,
        fontWeight: 600,
        textTransform: 'uppercase',
        minHeight: 14,
        lineHeight: 1.2,
      }} className="mono">
        {srcDisplay}
      </div>
    </div>
  );
}

function MasterSection({ master, onChange, paLevel, paRLevel, powered = true, onInspect }) {
  return (
    <div style={{
      background: 'linear-gradient(180deg,#2a2a30 0%, #1f1f23 8%, #1c1c20 100%)',
      border: '1px solid #0a0a0c',
      borderTop: '1px solid #45454d',
      borderRadius: 4,
      padding: '10px 12px 12px',
      display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 7,
      width: 150,
      opacity: powered ? 1 : 0.5,
      filter: powered ? 'none' : 'grayscale(0.75)',
      transition: 'opacity 0.15s, filter 0.15s',
    }}>
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', width: '100%' }}>
        <div className="display" style={{ fontSize: 13, fontWeight: 800, color: 'var(--accent)', letterSpacing: 0.5, lineHeight: 1 }}>MASTER</div>
        <div className="mono" style={{ fontSize: 7, color: 'var(--ink-3)', letterSpacing: 1 }}>MAIN MIX · L/R</div>
      </div>

      {/* Aux send masters — sit alongside the main master, each controlling
          the overall level of its aux bus before it leaves the desk. */}
      <div style={{ display: 'flex', gap: 12, alignItems: 'center', justifyContent: 'center' }}>
        <K value={master.aux1 != null ? master.aux1 : 0.75}
           onChange={(v) => onChange({ ...master, aux1: v })}
           label="AUX 1" size={32} color="var(--aux)" />
        <K value={master.aux2 != null ? master.aux2 : 0.75}
           onChange={(v) => onChange({ ...master, aux2: v })}
           label="AUX 2" size={32} color="var(--cool)" />
      </div>

      <div style={{ width: '100%', height: 1, background: '#0a0a0c', boxShadow: '0 1px 0 #3a3a40' }}/>

      <BP active={master.mute} onClick={() => onChange({ ...master, mute: !master.mute })} label="MUTE MAIN" color="var(--hot)" width={108} height={22} fontSize={10}/>

      <div style={{ display: 'flex', alignItems: 'flex-end', gap: 6, marginTop: 1 }}>
        <F value={master.fader} onChange={(v) => { onChange({ ...master, fader: v }); if (onInspect) onInspect('pa'); }} height={208}/>
        <div style={{ display: 'flex', gap: 3 }}>
          <M level={paLevel} height={208} segments={26}/>
          <M level={paRLevel} height={208} segments={26}/>
        </div>
      </div>

      <div className="mono" style={{ fontSize: 7, color: 'var(--ink-3)', letterSpacing: 1 }}>L · R</div>
    </div>
  );
}

function Console({ state, setState, audio, faultChannelIdx }) {
  // Functional updates so a control change and an auto-inspect switch can be
  // dispatched back-to-back without one clobbering the other.
  const updateChannel = (i, ch) => setState(prev => {
    const channels = [...prev.channels];
    channels[i] = ch;
    return { ...prev, channels };
  });
  const updateMaster = (m) => setState(prev => ({ ...prev, master: m }));
  // Auto-follow: adjusting a control switches "you are listening to" to the
  // destination that control feeds, so a new user hears what they're changing
  // (a fader feeds the PA, AUX 1 the first wedge, AUX 2 the second).
  const inspectTo = (dest) => setState(prev => prev.inspect === dest ? prev : { ...prev, inspect: dest });

  // Phantom toggle goes through here so we can run the safety check at the
  // moment the user hits +48V. Turning phantom OFF is always allowed (no
  // pop risk). Turning phantom ON: if the channel + master + a speaker are
  // all open, we still apply the change (the +48V really did engage) but
  // we also record a phantomPop — that flag drives the visual flash and
  // blocks the level from registering as solved this attempt.
  //
  // Uses functional setState so back-to-back clicks (e.g. MUTE → +48V in
  // quick succession) see the most-recent state, not the value closed over
  // at render time.
  const togglePhantom = (i) => {
    setState(prev => {
      const ch = prev.channels[i];
      if (!ch) return prev;
      const turningOn = !ch.phantom;
      const channels = prev.channels.map((c, j) => j === i ? { ...c, phantom: !c.phantom } : c);
      const next = { ...prev, channels };
      if (turningOn) {
        // PFL is pre-fader/pre-mute: if this channel is soloed, the +48V
        // switch-on transient goes straight to the engineer's headphones,
        // muted or not. Right in the ears. That's the worst kind of pop.
        if (ch.solo) {
          next.phantomPop = { channel: i, at: Date.now(), cause: 'phantom_cans' };
        } else if (window.wouldPopPhantom && window.wouldPopPhantom(prev, i)) {
          next.phantomPop = { channel: i, at: Date.now() };
        }
      }
      return next;
    });
  };

  // When the console is powered down, its meters and LEDs are dead — they draw
  // no signal because they have no power. So zero every console meter and gate
  // the indicator LEDs on mixer power. (The master L/R meters already go dark
  // because the main bus is gated by mixer power upstream.)
  const mixerOn = state.mixer ? state.mixer.on !== false : true;
  const channelLevels = audio.post.map((p) => mixerOn ? p * 1.2 : 0);
  const pflLevels = audio.chanIn.map(v => mixerOn ? v * 0.95 : 0);

  // Master L/R meters read from the MAIN BUS (post master fader, pre-PA).
  // Speaker on/off/mute/volume must NOT silence these — that's the speaker's
  // problem, not the desk's, and a real console keeps showing what it's
  // sending no matter what's happening downstream.
  //
  // The 0.85 display multiplier is calibrated so a typical multi-channel
  // mix at default fader settings sits in the YELLOW band — leaves visual
  // headroom before the red, so the meter remains a useful operating
  // signal rather than pegged red by the act of opening the master.
  const main = audio.mainBus || { L: 0, R: 0 };
  const masterL = (main.L || 0) * 0.85;
  const masterR = (main.R || 0) * 0.85;

  return (
    <div style={{
      display: 'flex',
      gap: 8,
      padding: '16px 14px 12px',
      background: 'linear-gradient(180deg, #2a2a2e 0%, #1c1c1f 100%)',
      border: '1px solid #0a0a0c',
      borderRadius: 8,
      boxShadow: 'inset 0 1px 0 #45454d, 0 4px 20px rgba(0,0,0,0.5)',
      position: 'relative',
    }}>
      <div style={{ position: 'absolute', top: -1, left: 12, display: 'flex', gap: 8, alignItems: 'center' }}>
        {/* Mixer power. The orange status LED follows the power state so the
            student gets an immediate visual that the desk is or isn't on.
            Most levels start with the mixer on (default state) — the Power-On
            Sequence is the lesson that uses this. */}
        {(() => {
          return <>
            <div style={{
              width: 6, height: 6, borderRadius: '50%',
              background: mixerOn ? 'var(--accent)' : '#3a1a1a',
              boxShadow: mixerOn ? '0 0 6px var(--accent)' : 'inset 0 0 0 1px rgba(90,32,24,0.6)',
              transition: 'background 0.15s, box-shadow 0.15s',
            }}/>
            <div className="display" style={{ fontSize: 10, color: mixerOn ? 'var(--ink-2)' : '#5a2018', letterSpacing: 1.5, fontWeight: 700, textTransform: 'uppercase' }}>AU · MX-4</div>
            <PowerButton on={mixerOn} width={32} height={13}
              onClick={() => {
                setState(prev => {
                  const wasOn = prev.mixer ? prev.mixer.on !== false : true;
                  const turningOn = !wasOn;
                  const next = { ...prev, mixer: { ...(prev.mixer || {}), on: !wasOn } };
                  if (turningOn && window.wouldPopOnMixerOn && window.wouldPopOnMixerOn(prev)) {
                    next.phantomPop = { at: Date.now(), cause: 'mixer_pop' };
                  }
                  return next;
                });
              }}/>
          </>;
        })()}
      </div>

      {state.channels.map((ch, i) => {
        const srcKey = audio.chanInSource[i];
        const srcLabel = srcKey ? window.SOURCES[srcKey] : null;
        return (
          <ChannelStrip
            key={i}
            ch={ch}
            idx={i}
            onChange={(c) => updateChannel(i, c)}
            onPhantomToggle={() => togglePhantom(i)}
            onInspect={inspectTo}
            channelLevel={channelLevels[i]}
            pflLevel={pflLevels[i]}
            isFaultStrip={faultChannelIdx === i}
            srcLabel={srcLabel}
            powered={mixerOn}
          />
        );
      })}

      <div style={{ width: 1, background: '#0a0a0c', boxShadow: '1px 0 0 #3a3a40' }}/>

      <MasterSection
        master={state.master}
        onChange={updateMaster}
        paLevel={masterL}
        paRLevel={masterR}
        powered={mixerOn}
        onInspect={inspectTo}
      />
    </div>
  );
}

window.Console = Console;
</script>

<script type="text/babel">
const { useState: useS2, useRef: useR2, useEffect: useE2 } = React;

// Responsive breakpoint — below this we collapse the sidebar+stage row into
// a single vertical column so phone/tablet viewports don't horizontally
// squeeze the stage or mixer.
const MOBILE_BREAKPOINT = 1024;
function useViewport() {
  const [isMobile, setIsMobile] = useS2(typeof window !== 'undefined' ? window.innerWidth < MOBILE_BREAKPOINT : false);
  useE2(() => {
    const handler = () => setIsMobile(window.innerWidth < MOBILE_BREAKPOINT);
    window.addEventListener('resize', handler);
    return () => window.removeEventListener('resize', handler);
  }, []);
  return isMobile;
}

// Uniform scale-to-fit. Measures the available box (the scroll container) and
// returns the factor that fits a fixed designW x designH board inside it.
// min(width-ratio, height-ratio) so it always fits both axes; clamped so it
// never shrinks below 0.45 or grows past 3.0. The high upper bound lets the
// board fill big monitors and fullscreen (a 4K screen fills width at ~2.46);
// past ~4680px wide it stops growing so controls don't get absurd. A
// ResizeObserver on the viewport catches window resizes, TopBar reflow, and
// OS/browser zoom alike.
function useFitScale(viewportRef, designW, designH, enabled) {
  const [scale, setScale] = useS2(1);
  useE2(() => {
    const el = viewportRef.current;
    if (!enabled || !el || !designW || !designH) return;
    const recompute = () => {
      const availW = el.clientWidth, availH = el.clientHeight;
      if (!availW || !availH) return;
      const raw = Math.min(availW / designW, availH / designH);
      setScale(Math.max(0.45, Math.min(3, raw)));
    };
    recompute();
    const ro = new ResizeObserver(recompute);
    ro.observe(el);
    window.addEventListener('resize', recompute);
    return () => { ro.disconnect(); window.removeEventListener('resize', recompute); };
  }, [viewportRef, designW, designH, enabled]);
  return scale;
}

// Dynamic handheld vocal mic — Shure SM58 silhouette: big spherical ball
// grille on a tapered body. The default live vocal mic.
function MicSm58Icon({ size = 60, glow = false }) {
  return (
    <svg width={size} height={size * 1.25} viewBox="0 0 60 75">
      <defs>
        <radialGradient id="sm58-ball" cx="40%" cy="32%" r="72%">
          <stop offset="0" stopColor="#54545c"/><stop offset="0.55" stopColor="#2e2e34"/><stop offset="1" stopColor="#141417"/>

// One band of the monitor EQ. value = cut fraction (0 flat .. 1 full cut). The
// visible bar is the pass level (1 - cut), so pulling it down cuts that band —
// like a graphic-EQ slider. When this band is the one ringing, it glows red.
function EqBand({ value, onChange, label, ringing, accent }) {
  const ref = React.useRef(null);
  const startRef = React.useRef(null);
  const fitScale = React.useContext(window.FitScaleContext) || 1;
  const H = 24;
  const onDown = (e) => { e.preventDefault(); e.stopPropagation(); try { ref.current.setPointerCapture(e.pointerId); } catch(_){} startRef.current = { y: e.clientY, v: value || 0 }; };
  const onMove = (e) => { if (!startRef.current) return; const dy = (e.clientY - startRef.current.y) / (fitScale || 1); let v = startRef.current.v + dy / H; v = Math.max(0, Math.min(1, v)); onChange(v); };
  const onUp = (e) => { startRef.current = null; try { ref.current.releasePointerCapture(e.pointerId); } catch(_){} };
  const pass = 1 - (value || 0);
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 1 }}>
      <div ref={ref} onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} className="ui-no-select"
        style={{ width: 8, height: H, background: '#0a0a0c', border: '1px solid ' + (ringing ? 'var(--hot)' : '#2a2a2e'), borderRadius: 2, position: 'relative', cursor: 'ns-resize',
          boxShadow: ringing ? '0 0 7px rgba(255,70,48,0.7)' : 'none', animation: ringing ? 'pulse 0.9s ease-in-out infinite' : 'none' }}>
        <div style={{ position: 'absolute', left: 0, right: 0, bottom: 0, height: pass * (H - 2), background: ringing ? 'var(--hot)' : accent, opacity: 0.85, borderRadius: '0 0 1px 1px' }}/>
      </div>
      <div className="mono" style={{ fontSize: 5, lineHeight: 1, color: ringing ? 'var(--hot)' : 'var(--ink-3)' }}>{label}</div>
    </div>
  );
}

function EqStrip({ eq, onChange, ringBand, accent }) {

}
